<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Orquestra</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
  <style>
    :root { --ink: #17211c; --forest: #173f32; --moss: #2e6952; --paper: #f7f4ec; --cream: #fffdf8; --brass: #c9913c; --muted: #6d766f; --line: #ded9cc; --danger: #b63b3b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DM Sans", sans-serif; color: var(--ink); background: #f7f4ec; }
    .app-shell { width: 100%; min-height: 100vh; background: #f7f4ec; }
    .serif { font-family: "Fraunces", serif; }
    .nav-item { transition: .2s ease; cursor: pointer; }
    .nav-item.active, .nav-item:hover { background: rgba(255,255,255,.18) !important; color: #fff !important; }
    .view { display: none; }
    .view.active { display: block; animation: rise .3s ease both; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .tab-button.active { background: var(--forest) !important; color: white !important; border-color: var(--forest) !important; }
    .report-period.active { background: var(--forest) !important; color: white !important; border-color: var(--forest) !important; }
    .metric-card { box-shadow: 0 12px 30px rgba(31, 49, 39, .06); }
    .ring { width: 110px; height: 110px; border-radius: 999px; display: grid; place-items: center; background: conic-gradient(var(--ring-color, var(--moss)) calc(var(--percent) * 1%), #ece7dc 0); position: relative; }
    .ring::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--cream); }
    .ring > span { position: relative; z-index: 1; font-weight: 700; font-size: 18px; }
    .scrollbar-soft::-webkit-scrollbar { width: 7px; height: 7px; }
    .scrollbar-soft::-webkit-scrollbar-thumb { background: #cbc4b4; border-radius: 99px; }
    .toast { transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .attendance-card.selected { background: #e0f1e6; border-color: #5ea376; }
    .attendance-card.selected .presence-dot { background: #2e8b57; }
    .modal-backdrop { display: none; }
    .modal-backdrop.open { display: flex; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) { .sidebar { position: static; width: 100%; } .layout-grid { grid-template-columns: 1fr !important; } .mobile-scroll { overflow-x: auto; } }
    @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; inset: 0; width: 100%; } .no-print { display: none !important; } }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#173f32] p-4">
    <div class="w-full max-w-md rounded-2xl bg-[#fffdf8] p-8 shadow-2xl border border-[#ded9cc]">
      <div class="flex items-center gap-3 justify-center mb-6">
        <div class="w-12 h-12 rounded-full bg-[#c9913c] text-[#173f32] flex items-center justify-center font-bold text-2xl">♫</div>
        <div><p class="text-xs uppercase tracking-[.18em] text-[#6d766f] font-semibold">Orquestra</p><h2 class="serif font-bold text-lg text-[#173f32]">Pr. João Batista</h2></div>
      </div>
      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div><label class="block text-xs font-semibold text-[#17211c] mb-1">E-mail</label><input id="login-email" type="email" required class="w-full rounded-xl border border-[#ded9cc] px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#2e6952]"></div>
        <div><label class="block text-xs font-semibold text-[#17211c] mb-1">Senha</label><input id="login-password" type="password" required class="w-full rounded-xl border border-[#ded9cc] px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#2e6952]"></div>
        <button id="login-submit" type="submit" class="w-full rounded-xl bg-[#c9913c] py-3 text-sm font-bold text-[#173f32] hover:opacity-90">Entrar</button>
      </form>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="main-app" class="app-shell hidden">
    <div class="layout-grid grid grid-cols-[260px_1fr] min-h-screen">
      <aside class="sidebar bg-[#173f32] text-white p-5 flex flex-col justify-between">
        <div>
          <header class="mb-8"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-[#c9913c] text-[#173f32] flex items-center justify-center font-bold text-lg">♫</div><div><p class="text-xs uppercase tracking-[.18em] text-[#d9e4dc] font-semibold">Orquestra</p><h1 class="serif font-semibold leading-tight text-white text-base">Pr. João Batista</h1></div></div></header>
          <nav class="space-y-2">
            <button class="nav-item active w-full text-left rounded-xl px-4 py-3 flex items-center gap-3 bg-white/10" onclick="switchView('dashboard')"><span class="text-lg">📊</span><span class="font-semibold text-sm">Visão Geral</span></button>
            <button class="nav-item w-full text-left rounded-xl px-4 py-3 flex items-center gap-3" onclick="switchView('inventory')"><span class="text-lg">📦</span><span class="font-semibold text-sm">Inventário</span></button>
            <button class="nav-item w-full text-left rounded-xl px-4 py-3 flex items-center gap-3" onclick="switchView('attendance')"><span class="text-lg">📅</span><span class="font-semibold text-sm">Frequência</span></button>
          </nav>
        </div>
        <div class="mt-8 space-y-3"><div class="rounded-2xl p-4 bg-[#245341]"><div class="flex items-center gap-2 mb-1"><span id="status-indicator" class="inline-block w-2.5 h-2.5 rounded-full bg-green-400"></span><p id="status-text" class="font-semibold text-sm text-white">Conectado</p></div></div><button onclick="handleLogout()" class="w-full text-left rounded-xl px-4 py-2.5 flex items-center gap-3 text-red-300 hover:text-red-100 text-sm font-semibold"><span>🚪</span> Sair</button></div>
      </aside>
      
      <main class="w-full p-5 md:p-8 overflow-y-auto">
        <!-- DASHBOARD, INVENTARIO, FREQUENCIA -->
        <section id="dashboard" class="view active">...</section>
        <section id="inventory" class="view">
            <div id="instruments-panel" class="tab-panel active pt-6">
                <div class="grid grid-cols-1 xl:grid-cols-[1fr_330px] gap-5">
                    <section class="rounded-2xl bg-[#fffdf8] border border-[#ded9cc] p-5">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs uppercase tracking-wide text-[#6d766f] border-b border-[#ded9cc]">
                                <tr><th class="pb-3">Instrumento</th><th class="pb-3">Naipe</th><th class="pb-3">Ações</th></tr>
                            </thead>
                            <tbody id="instrument-list"></tbody>
                        </table>
                    </section>
                    <aside class="rounded-2xl bg-[#173f32] text-white p-5 h-fit">
                        <form id="instrument-form" class="mt-5 space-y-3">
                            <input id="instrument-tag" required class="w-full mt-1 rounded-lg px-3 py-2 text-sm text-[#17211c]" type="text" placeholder="Tag">
                            <input id="instrument-name" required class="w-full mt-1 rounded-lg px-3 py-2 text-sm text-[#17211c]" type="text" placeholder="Nome">
                            <select id="instrument-naipe" required class="w-full mt-1 rounded-lg px-3 py-2 text-sm text-[#17211c]">
                                <option value="">Naipe</option><option>Cordas</option><option>Madeiras</option><option>Metais</option><option>Base</option>
                            </select>
                            <input id="instrument-value-input" required min="0" step="0.01" class="w-full mt-1 rounded-lg px-3 py-2 text-sm text-[#17211c]" type="number" placeholder="Valor (R$)">
                            <input id="instrument-photo" class="w-full mt-1 rounded-lg px-3 py-2 text-sm text-[#17211c]" type="text" placeholder="URL da Foto">
                            <button id="instrument-submit" class="w-full rounded-lg py-2.5 mt-2 font-bold bg-[#c9913c] text-[#173f32]" type="submit">Salvar</button>
                        </form>
                    </aside>
                </div>
            </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    // ... [Manter a lógica original de state, fetch, e renderização] ...
    // DICA: No renderInstruments, atualize para:
    // <td class="py-3"><img src="${item.foto_url || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-lg object-cover"></td>
  </script>
</body>
</html>
